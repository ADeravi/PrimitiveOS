name: Policy check

# Single aggregate gate for the visualisation policy model: primitives on the
# Carbon scales, the chart linter (good vs bad spec), and per-idiom diagram
# geometry + edge routing — all headless (no browser), via the shared modules.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run policy probe (primitives + charts + diagram geometry + edges)
        run: npm run lint:policies
